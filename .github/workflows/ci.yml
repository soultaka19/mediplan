name: CI

# Contrôle qualité : s'exécute sur chaque poussée et chaque pull request vers
# les branches d'intégration. Rien n'est déployé ici — ce workflow atteste que
# le code compile et que les tests passent, avant qu'une image ne soit publiée.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente,
# encore en cours. Économise des minutes de CI sans perdre d'information.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, build et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Installation de pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Installation de Node.js
        uses: actions/setup-node@v7
        with:
          # Version épinglée, identique à .nvmrc : Angular CLI 22 exige
          # Node >= 22.22.3 ou >= 24.15.0, et la CI doit tester la même version
          # que les postes de développement.
          node-version: 22.22.3
          cache: pnpm

      - name: Installation des dépendances
        # --frozen-lockfile : échoue si le lockfile ne correspond pas aux
        # manifestes, plutôt que de résoudre silencieusement d'autres versions.
        run: pnpm install --frozen-lockfile

      # Formatage et analyse statique BLOQUENT désormais.
      #
      # Ces deux étapes ont longtemps porté un `continue-on-error` : le dépôt
      # traînait 271 fichiers signalés par Prettier (dont 37 écarts réels, le
      # reste étant du bruit CRLF dû à `endOfLine: "lf"`) et 26 erreurs eslint.
      # La dette a été résorbée le 29 août 2026 — les rendre bloquantes ne
      # produit plus une CI rouge en permanence, donc ignorée, mais un garde-fou.
      - name: Vérification du formatage
        run: pnpm format:check

      - name: Analyse statique
        run: pnpm lint

      - name: Compilation
        run: pnpm build

      - name: Tests
        run: pnpm test

  infrastructure:
    name: Validation des templates Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v7

      - name: Compilation des templates
        # Détecte les erreurs de syntaxe et de typage de l'infrastructure au
        # même titre que celles du code applicatif. Aucune ressource n'est
        # touchée : c'est une compilation locale, sans connexion à Azure.
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
