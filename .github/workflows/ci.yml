name: CI

# Contrôle qualité : s'exécute sur chaque poussée et chaque pull request vers
# les branches d'intégration. Rien n'est déployé ici — ce workflow atteste que
# le code compile et que les tests passent, avant qu'une image ne soit publiée.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Une seule exécution par branche : une nouvelle poussée annule la précédente,
# encore en cours. Économise des minutes de CI sans perdre d'information.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, build et tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          # Version épinglée, identique à .nvmrc : Angular CLI 22 exige
          # Node >= 22.22.3 ou >= 24.15.0, et la CI doit tester la même version
          # que les postes de développement.
          node-version: 22.22.3
          cache: pnpm

      - name: Installation des dépendances
        # --frozen-lockfile : échoue si le lockfile ne correspond pas aux
        # manifestes, plutôt que de résoudre silencieusement d'autres versions.
        run: pnpm install --frozen-lockfile

      # Formatage et analyse statique sont RAPPORTÉS mais ne bloquent pas.
      #
      # Le dépôt porte une dette antérieure à cette CI : 41 fichiers non
      # conformes à Prettier, 8 erreurs eslint dans le frontend (éléments
      # cliquables non focalisables au clavier) et 18 dans le backend, toutes
      # dans des fichiers de test. Les corriger touche le comportement de
      # l'interface et mérite son propre travail, revu à part.
      #
      # Les rendre bloquantes rendrait la CI rouge en permanence, donc ignorée.
      # Les afficher garde la dette visible et permet de la résorber au fil de
      # l'eau, puis de retirer ces `continue-on-error`.
      - name: Vérification du formatage (informatif)
        continue-on-error: true
        run: pnpm format:check

      - name: Analyse statique (informatif)
        continue-on-error: true
        run: pnpm lint

      - name: Compilation
        run: pnpm build

      - name: Tests
        run: pnpm test

  infrastructure:
    name: Validation des templates Bicep
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Compilation des templates
        # Détecte les erreurs de syntaxe et de typage de l'infrastructure au
        # même titre que celles du code applicatif. Aucune ressource n'est
        # touchée : c'est une compilation locale, sans connexion à Azure.
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
