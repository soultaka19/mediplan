<div class="mp-empty">
  <mat-icon aria-hidden="true" class="mp-empty__icon">{{ icon() }}</mat-icon>
  <h2 class="mp-empty__title">{{ title() }}</h2>
  @if (description()) {
    <p class="mp-empty__desc">{{ description() }}</p>
  }
  @if (actionLabel()) {
    <button matButton="filled" type="button" (click)="action.emit()">{{ actionLabel() }}</button>
  }
</div>
