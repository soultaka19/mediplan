<h1 id="dashboard-title" class="dashboard-title">Tableau de bord</h1>

<mat-card class="dashboard-card" appearance="outlined" aria-labelledby="dashboard-title">
  <mat-card-content>
    @if (user(); as currentUser) {
      <p class="welcome" data-testid="dashboard-welcome">
        Bienvenue, <strong>{{ displayName() }}</strong>.
      </p>

      <dl class="user-info">
        <dt>Adresse e-mail</dt>
        <dd data-testid="dashboard-email">{{ currentUser.email }}</dd>

        <dt>Rôle</dt>
        <dd data-testid="dashboard-role">{{ roleLabel() }}</dd>
      </dl>
    }
  </mat-card-content>
</mat-card>
